<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            background-image: url(hello.jpg);
            background-size: cover;
            min-height: 100vh;
            background-position: center;
        }

        .box {
            background-color: white;
            border-radius: 25px;
            margin: 20px;
            padding: 30px;
            width: 90%;
            height: 200px;
        }

        input {
            width: 180px;
            padding: 5px;
        }

        button {
            padding: 5px;

        }
    </style>

</head>

<body>

    <div class="box">
    
        <h3 style="color: blue; font-family: Tahoma">Login</h3>

        <form>
            Username <br><br>
            <input type="text"> <br><br>

            Password <br><br>
            <input type="password">
            <button>Login</button> 
        </form>
    </div>

</body>

</html>
